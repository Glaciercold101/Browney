<style id="templates-style">
.template-root .card, .template-root .color-container{transition:all .15s}
.template-root .card:hover, .template-root .color-container:hover{box-shadow:0 8px 24px rgba(0,0,0,.08)!important}
.exportable-card{position:relative}
.color-containers-root .color-container[contenteditable]:focus, .prayer-template [contenteditable]:focus{outline:2px solid rgba(139,94,52,.18);outline-offset:2px;border-radius:6px}
</style>


<style id="accent-override">
:root{--theme-accent:#8b5e34}
.bg-zinc-900{background-color:var(--theme-accent)!important;color:white!important;border-color:var(--theme-accent)!important}
.hover\:bg-zinc-900:hover{background-color:var(--theme-accent)!important;color:white!important}
.border-zinc-900{border-color:var(--theme-accent)!important}
.hover\:bg-zinc-800:hover{background-color:color-mix(in srgb,var(--theme-accent) 85%, black)!important}
</style>


<style id="nb-img-module-v2">
figure.img-wrap{position:relative;display:block;margin:1.4em 0;border:2px solid transparent;border-radius:12px;overflow:hidden;max-width:100%;transition:outline .12s, border-color .12s; background:white;}
figure.img-wrap.selected{outline:2px solid #2563eb; outline-offset:2px; border-color: rgba(37,99,235,.15);}
figure.img-wrap img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none}
figure.img-wrap.align-left{margin-left:0;margin-right:auto}
figure.img-wrap.align-center{margin-left:auto;margin-right:auto}
figure.img-wrap.align-right{margin-left:auto;margin-right:0}
.img-handle{position:absolute;right:8px;bottom:8px;width:20px;height:20px;background:#2563eb;border-radius:6px;cursor:nwse-resize;box-shadow:0 2px 8px rgba(0,0,0,.3);border:2px solid white; z-index:2; display:block;}
.img-handle:after{content:"";position:absolute;inset:3px;border-right:2px solid white;border-bottom:2px solid white;border-radius:1px}
@keyframes pop{from{transform:translateY(4px);opacity:0}to{transform:none;opacity:1}}
</style>


<style id="ctx-menu-v2">
#ctxMenu{width:320px !important; border-radius:16px !important; box-shadow:0 16px 40px rgba(0,0,0,.16),0 0 0 1px rgba(0,0,0,.04) !important; overflow:hidden !important;}
#ctxMenu .max-h-\[45vh\]{max-height:38vh !important;}
#ctxMenu button{transition:all .12s ease;}
#ctxMenu .grid-cols-8 button:hover{transform:translateY(-1px); box-shadow:0 2px 8px rgba(0,0,0,.08);}
#ctxMenu .rounded-full{transition:all .12s;}
/* Shorter box */
#ctxMenu .p-1{padding:6px !important;}
/* Make top cut/copy row compact */
#ctxMenu .flex.items-center.gap-2{padding:2px 0;}
</style>


<style id="ctx-fix-v3">
#ctxMenu{width:320px !important; border-radius:16px !important; max-height: min(85vh, 560px) !important;}
#ctxMenu > div:first-child{max-height: 38vh !important; overflow:auto !important;}
#ctxMenu button:hover{transform:translateY(-1px); box-shadow:0 2px 8px rgba(0,0,0,.08);}
</style>

<div class="template-root prayer-template" data-template="morning-prayers" style="max-width:920px;margin:0 auto;padding:1.5rem 0;">
  <div class="toc-card" style="background:#fff;border:1px solid rgba(0,0,0,.06);border-radius:20px;box-shadow:0 12px 30px rgba(44,42,38,.08);padding:1.5rem;position:relative;overflow:hidden;margin-bottom:1.5rem">
    <div style="position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,#c9a66b,#8b5e34)"></div>
    <div style="font-size:.9rem;letter-spacing:.12em;text-transform:uppercase;color:#8b5e34;font-weight:700;margin-bottom:1rem">Morning Prayers</div>

window.exportContainerAsImage=async function(el){
  if(!el){alert("No container found");return;}
  try{
    const width=el.offsetWidth||600;
    const height=el.offsetHeight||400;
    const borderColor=el.getAttribute('data-color')||"#8b5e34";
    const canvas=document.createElement("canvas");
    const scale=2;
    canvas.width=width*scale;
    canvas.height=(height+60)*scale;
    const ctx=canvas.getContext("2d");
    ctx.scale(scale,scale);
    ctx.fillStyle="#ffffff";
    ctx.fillRect(0,0,width,height+60);
    ctx.fillStyle=borderColor;
    ctx.fillRect(0,0,4,height+60);
    let titleEl=el.querySelector('[contenteditable]')||el.querySelector('h2')||el;
    let titleText=(titleEl.innerText||"Container").split("\n")[0].slice(0,80);
    ctx.fillStyle="#111827";
    ctx.font="bold 13px system-ui, sans-serif";
    ctx.fillText(titleText, 12, 20);
    let contentEl=el.querySelectorAll('[contenteditable]')[1]||el.querySelector('.container-content')||el;
    let contentText=contentEl.innerText||el.innerText||"";
    contentText=contentText.slice(0,1000);
    ctx.fillStyle="#374151";
    ctx.font="12px system-ui, sans-serif";
    const maxWidth=width-24;
    const lines=[];
    let line="";
    const words=contentText.split(/\s+/);
    for(let w of words){
      let test=line+w+" ";
      if(ctx.measureText(test).width>maxWidth && line!=""){
        lines.push(line);
        line=w+" ";
      }else line=test;
      if(lines.length>40) break;
    }
    if(line) lines.push(line);
    let y=38;
    for(let l of lines){
      if(y>height+30) break;
      ctx.fillText(l, 12, y);
      y+=15;
    }
    const imgs=el.querySelectorAll('img');
    let imgY=y+6;
    for(let imgEl of imgs){
      try{
        if(imgEl.complete && imgEl.naturalWidth>0){
          const imgW=Math.min(100, imgEl.naturalWidth, width-24);
          const imgH=imgW*(imgEl.naturalHeight/imgEl.naturalWidth||1);
          ctx.drawImage(imgEl, 12, imgY, imgW, imgH);
          imgY+=imgH+8;
        }
      }catch(e){}
    }
    const a=document.createElement("a");
    a.download="container-"+Date.now()+".png";
    a.href=canvas.toDataURL("image/png");
    a.click();
  }catch(e){
    console.error(e);
    alert("Export failed");
  }
};

};
window.addKanbanColumnToLastRow=function(btn){

    const board=lastLane?lastLane.querySelector('.kanban-board'):root.querySelector('.kanban-board');
    if(!board) return;
    window.addKanbanColumn({closest:function(){return board;}});
  }catch(e){console.error(e);}
};

<script>
// Auto-link pasted URLs to light blue
document.addEventListener('paste', function(e){
  try{
    const dt=e.clipboardData;
    if(!dt) return;
    if(dt.types.includes('text/html')) return;
    const txt=dt.getData('text/plain').trim();
    if(!/^https?:\/\/[^\s]+$/i.test(txt)) return;
    const sel=window.getSelection();
    if(!sel || !sel.anchorNode) return;
    const editable = sel.anchorNode.nodeType===3 ? sel.anchorNode.parentElement : sel.anchorNode;
    if(!editable || !editable.closest('[contenteditable="true"]')) return;
    e.preventDefault();
    const a=document.createElement('a');
    a.href=txt; a.textContent=txt;
    a.style.color='#3b82f6'; a.style.textDecoration='underline';
    a.target='_blank'; a.rel='noopener noreferrer';
    const range=sel.getRangeAt(0);
    range.deleteContents();
    range.insertNode(a);
    const nr=document.createRange(); nr.setStartAfter(a); nr.collapse(true);
    sel.removeAllRanges(); sel.addRange(nr);
  }catch(err){}
});
</script>

<script id="img-module-v2-script">
// === Image Module v2 from tiny-desktop app ===
window._nbStartImgResize = function(e){
  e.preventDefault(); e.stopPropagation();
  const fig = e.target.closest('figure.img-wrap') || e.target.closest('figure');
  if(!fig) return;
  document.querySelectorAll('figure.img-wrap.selected').forEach(el=>{ if(el!==fig) el.classList.remove('selected'); });
  fig.classList.add('selected');
  const startX = e.clientX;
  const startW = fig.getBoundingClientRect().width;
  const parentW = fig.parentElement.getBoundingClientRect().width;
  function move(ev){
    const dx = ev.clientX - startX;
    const nw = Math.max(80, Math.min(parentW-20, startW + dx));
    const perc = Math.round(nw/parentW*100);
    fig.style.width = perc + '%';
    const toolbar = document.getElementById('imgToolbar') || document.getElementById('imgToolbar2');
    if(toolbar){
      const range = toolbar.querySelector('input[type="range"]');
      if(range) range.value = perc;
    }
  }
  function up(){
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', up);
    try{
      const editor = fig.closest('[contenteditable="true"]');
      if(editor){ editor.dispatchEvent(new Event('input', {bubbles:true})); }
    }catch(err){}
  }
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
};
document.addEventListener('click', (e)=>{
  const fig = e.target.closest('figure.img-wrap');
  const isToolbar = e.target.closest('#imgToolbar') || e.target.closest('#imgToolbar2');
  if(fig){
    document.querySelectorAll('figure.img-wrap.selected').forEach(el=>{ if(el!==fig) el.classList.remove('selected'); });
    fig.classList.add('selected');
  } else if(!isToolbar){
    setTimeout(()=>{
      const activeToolbar = document.getElementById('imgToolbar') || document.getElementById('imgToolbar2');
      if(!activeToolbar || !activeToolbar.contains(e.target)){
        if(!e.target.closest('figure.img-wrap')){
          document.querySelectorAll('figure.img-wrap.selected').forEach(el=> el.classList.remove('selected'));
        }
      }
    }, 10);
  }
});
function upgradeLegacyFigures(){
  document.querySelectorAll('figure:not(.img-wrap)').forEach(fig=>{
    if(fig.querySelector('img')){
      fig.classList.add('img-wrap','align-center');
      fig.setAttribute('contenteditable','false');
      if(!fig.style.width) fig.style.width='60%';
      fig.style.position='relative';
      fig.style.display='block';
      fig.style.borderRadius='12px';
      fig.style.overflow='hidden';
      fig.style.maxWidth='100%';
      if(!fig.querySelector('.img-handle')){
        const h=document.createElement('span');
        h.className='img-handle';
        h.addEventListener('mousedown', window._nbStartImgResize);
        fig.appendChild(h);
      }
    }
  });
}
document.addEventListener('DOMContentLoaded', ()=>{
  upgradeLegacyFigures();
  setInterval(upgradeLegacyFigures, 2000);
});
document.addEventListener('mousedown', (e)=>{
  if(e.target.classList.contains('img-handle')){
    window._nbStartImgResize(e);
  }
});
console.log('[Image Module v2] loaded');
</script>
